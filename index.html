<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
<title>Overmapper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <img src="assets/logo.svg" alt="" class="brand-logo">
        <div>
          <h1>Overmapper</h1>
          <p class="subtitle" data-i18n="subtitle">GPX-Track + Hintergrundbild &rarr; teilbares Poster</p>
        </div>
      </div>
      <div class="lang-switch">
        <select id="langSelect" aria-label="Sprache / Language">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <main class="layout">
      <section class="controls">

        <div class="panel">
          <h2 class="panel-title" data-i18n="panelSourceData">Quelldaten</h2>
          <div class="field">
            <label for="gpxInput" data-i18n="labelGpxFile">GPX-Datei</label>
            <input type="file" id="gpxInput" accept=".gpx,application/gpx+xml,text/xml,application/xml">
            <p class="hint" id="gpxHint" data-i18n="hintNoGpx">Noch keine Datei geladen</p>
          </div>
          <div class="field">
            <label for="imgInput" data-i18n="labelBackgroundImage">Hintergrundbild</label>
            <input type="file" id="imgInput" accept="image/*">
            <p class="hint" id="imgHint" data-i18n="hintNoImage">Noch kein Bild geladen</p>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel-title" data-i18n="panelFormat">Format</h2>
          <div class="segmented" id="presetSegmented" role="group">
            <button type="button" class="segmented-btn" data-value="1080x1350">4:5</button>
            <button type="button" class="segmented-btn" data-value="1080x1920">9:16</button>
            <button type="button" class="segmented-btn" data-value="1080x1080">1:1</button>
            <button type="button" class="segmented-btn" data-value="1200x630">16:9</button>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel-title" data-i18n="panelImage">Bild</h2>
          <div class="field">
            <div class="row-label">
              <label for="zoomRange" data-i18n="labelZoom">Zoom</label>
              <button type="button" id="resetImageBtn" class="link-btn" data-i18n="btnReset">Zurücksetzen</button>
            </div>
            <input type="range" id="zoomRange" min="1" max="3" step="0.01" value="1">
            <p class="hint" data-i18n="hintDragPreview">In der Vorschau ziehen, um den Ausschnitt zu verschieben.</p>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title-row">
            <h2 class="panel-title" data-i18n="panelTrack">Track</h2>
            <label class="toggle toggle-compact">
              <input type="checkbox" id="trackEnabled" checked>
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </label>
          </div>
          <div class="field" id="trackControls">
            <label data-i18n="labelColor">Farbe</label>
            <input type="color" id="accentColor" value="#ffffff" class="swatch">
          </div>
          <label class="toggle">
            <input type="checkbox" id="showBordersCheckbox">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label" data-i18n="toggleShowBorders">Ländergrenzen anzeigen</span>
          </label>
        </div>

        <div class="panel">
          <h2 class="panel-title" data-i18n="panelText">Text</h2>

          <div class="field">
            <label data-i18n="labelColor">Farbe</label>
            <input type="color" id="textColor" value="#ffffff" class="swatch">
          </div>

          <div class="subsection">
            <div class="row-label">
              <label for="titleInput" data-i18n="labelTitle">Titel</label>
              <label class="toggle toggle-compact">
                <input type="checkbox" id="titleEnabled" checked>
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
              </label>
            </div>
            <input type="text" id="titleInput" data-i18n-placeholder="placeholderTitle" placeholder="z.&nbsp;B. Alpencross 2026" maxlength="60">
          </div>

          <div class="subsection">
            <div class="row-label">
              <label data-i18n="labelDistance">Entfernung</label>
              <label class="toggle toggle-compact">
                <input type="checkbox" id="distanceEnabled" checked>
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
              </label>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title-row">
            <h2 class="panel-title" data-i18n="panelFlags">Flaggen</h2>
            <label class="toggle toggle-compact">
              <input type="checkbox" id="flagsEnabled" checked>
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </label>
          </div>
        </div>

      </section>

      <section class="preview">
        <div class="canvas-wrap">
          <canvas id="canvas" width="1080" height="1350"></canvas>
          <p class="placeholder" id="placeholder" data-i18n="placeholderCanvas">Lade eine GPX-Datei und ein Hintergrundbild, um die Vorschau zu sehen.</p>
        </div>
        <button id="downloadBtn" disabled data-i18n="btnDownload">Poster herunterladen (PNG)</button>
        <p class="error" id="errorMsg"></p>
      </section>
    </main>
  </div>

  <script src="data/countries.js"></script>
  <script src="data/i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
